[project]
name = "uk-property-agent"
version = "0.4.0"
description = "Natural-language agent for UK property intelligence. LangGraph-based, with tool access to scrapers, government APIs, the geospatial engine, and the AVM."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Kubilay Yavuz" }]
keywords = ["uk", "property", "langgraph", "agent", "llm", "anthropic", "chainlit", "chat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.9",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "uk-property-scrapers",
    "uk-property-listings",
    "uk-property-apis",
    "uk-property-apify-client",
    "uk-property-avm",
    "uk-property-geo",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=0.3",
    "anthropic>=0.40",
]
openai = [
    "langchain-openai>=0.2",
    "openai>=1.40",
]
gemini = [
    "langchain-google-genai>=2.0",
    "google-genai>=0.8",
]
web = [
    "chainlit>=2.0",
]
all = [
    "langchain-anthropic>=0.3",
    "anthropic>=0.40",
    "langchain-openai>=0.2",
    "openai>=1.40",
    "langchain-google-genai>=2.0",
    "google-genai>=0.8",
    "chainlit>=2.0",
]

[project.scripts]
property-agent = "uk_property_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_property_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/uk_property_agent/_web_defaults/chainlit.md" = "uk_property_agent/_web_defaults/chainlit.md"
"src/uk_property_agent/_web_defaults/chainlit_config.toml" = "uk_property_agent/_web_defaults/chainlit_config.toml"
"src/uk_property_agent/_web_defaults/public" = "uk_property_agent/_web_defaults/public"
