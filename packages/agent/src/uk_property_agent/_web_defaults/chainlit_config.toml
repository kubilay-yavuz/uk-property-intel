[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
persist_user_env = false
mask_user_env = false
allow_origins = ["*"]

[features]
unsafe_allow_html = false
latex = false
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = true
allow_thread_sharing = false
favorites = false

[features.spontaneous_file_upload]
    enabled = false

[features.audio]
    enabled = false

[features.mcp]
    enabled = false

[UI]
name = "UK Property Intelligence"
description = "Natural-language agent for UK property: listings, sold prices, EPC, planning, flood risk, commute isochrones, and full postcode dossiers."
default_theme = "dark"
layout = "wide"
confirm_new_chat = false
cot = "full"
alert_style = "modern"
custom_css = "/public/custom.css"
default_avatar_file_url = "/public/avatar.svg"
avatar_size = 28
custom_meta_url = "https://github.com/"
custom_meta_image_url = "/public/logo_dark.svg"
# logo_file_url left empty: Chainlit auto-serves /public/logo_dark.svg
# and /public/logo_light.svg based on the active theme.
logo_file_url = ""

[meta]
generated_by = "uk-property-agent"
