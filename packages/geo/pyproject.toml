[project]
name = "uk-property-geo"
version = "0.1.0"
description = "Geospatial engine for UK property: postcode → coordinates, walking/driving/cycling times, isochrones, station proximity, school catchments."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Kubilay Yavuz" }]
keywords = ["uk", "property", "geo", "isochrone", "postcode", "routing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
polygons = [
    "shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_property_geo"]
