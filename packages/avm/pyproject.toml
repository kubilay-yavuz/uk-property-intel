[project]
name = "uk-property-avm"
version = "0.1.0"
description = "Automated Valuation Model (middle tier) for UK property — hedonic regression and gradient-boosted ensembles trained on Price Paid Data + EPC + listings."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Kubilay Yavuz" }]
keywords = ["uk", "property", "avm", "valuation", "hedonic", "xgboost"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "duckdb>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_property_avm"]
