[project]
name = "uk-property-intel"
version = "0.0.0"
description = "UK Property Intelligence — scrapers, enrichers, geospatial engine, AVM, and a natural-language agent for every property question in the UK."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Kubilay Yavuz" }]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
uk-property-scrapers = { workspace = true }
uk-property-listings = { workspace = true }
uk-property-apis = { workspace = true }
uk-property-geo = { workspace = true }
uk-property-avm = { workspace = true }
uk-property-agent = { workspace = true }
uk-property-apify-client = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
    "httpx>=0.27",
    "tenacity>=9.0",
    "h3>=4.4.2",
    "shapely>=2.1.2",
    "geopandas>=1.1.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/tests/fixtures/**"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle + pyflakes
    "I",               # isort
    "B",               # bugbear
    "UP",              # pyupgrade
    "SIM",             # simplify
    "RUF",             # ruff-specific
    "N",               # pep8-naming
    "TCH",             # type-checking imports
]
ignore = ["E501"]      # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B", "N"]
"packages/apis/**" = ["TC002", "TC003"]
"packages/listings/**" = ["TC001", "TC003"]
"packages/agent/**" = ["TC001", "TC002", "TC003"]
"packages/apify_client/**" = ["TC001", "TC003"]

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:langgraph.*",
    "ignore:.*create_react_agent has been moved.*:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
